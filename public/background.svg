<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="glow" cx="50%" cy="42%" r="70%">
      <stop offset="0%" stop-color="#1A1A1A"/>
      <stop offset="55%" stop-color="#0A0A0A"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </radialGradient>
    <radialGradient id="goldHeart" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#C9A84C" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#C9A84C" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#C9A84C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#C9A84C" stop-opacity="0.06"/>
    </linearGradient>
    <pattern id="grid" width="96" height="96" patternUnits="userSpaceOnUse">
      <path d="M96 0H0V96" fill="none" stroke="#C9A84C" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1920" height="1080" fill="url(#glow)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>

  <!-- gold glow behind hero -->
  <circle cx="960" cy="420" r="460" fill="url(#goldHeart)"/>

  <!-- floating book-spine outlines -->
  <g fill="none" stroke="#C9A84C" stroke-opacity="0.16" stroke-width="1.5">
    <rect x="200" y="600" width="150" height="210" rx="3"/>
    <rect x="212" y="622" width="126" height="168" rx="2"/>
    <rect x="1570" y="540" width="150" height="220" rx="3"/>
    <rect x="1582" y="562" width="126" height="176" rx="2"/>
    <rect x="400" y="330" width="110" height="150" rx="2"/>
    <rect x="1410" y="740" width="110" height="150" rx="2"/>
  </g>

  <!-- corner ornaments -->
  <g fill="none" stroke="#C9A84C" stroke-opacity="0.3" stroke-width="1.5">
    <path d="M60 60h60M60 60v60"/>
    <path d="M1860 60h-60M1860 60v60"/>
    <path d="M60 1020h60M60 1020v-60"/>
    <path d="M1860 1020h-60M1860 1020v-60"/>
  </g>

  <!-- gold hairline diagonals -->
  <g stroke="#C9A84C" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="1080" x2="1920" y2="0"/>
    <line x1="0" y1="1080" x2="1500" y2="0"/>
  </g>

  <!-- specular finish -->
  <rect width="1920" height="1080" fill="url(#sheen)"/>
</svg>
